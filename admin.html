<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursplan Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React und ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK v9 (modular) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ========================================
        // 🔥 FIREBASE KONFIGURATION
        // ========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA5gXGbM9TQCip1f27904_HlJNnWVCssA8",
            authDomain: "waffenrecht-guck.firebaseapp.com",
            projectId: "waffenrecht-guck",
            storageBucket: "waffenrecht-guck.firebasestorage.app",
            messagingSenderId: "280006919738",
            appId: "1:280006919738:web:ec829fb8ad0cba2dcb5703",
            measurementId: "G-2NVQLD5S74"
        };

        // Firebase initialisieren
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Icons als SVG-Komponenten
        const Plus = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Save = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        );

        const Star = ({ filled }) => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
        );

        function CourseCMSAdmin() {
            const [courses, setCourses] = useState([]);
            const [courseInfo, setCourseInfo] = useState({
                nextCourseDate: '01.08.2025',
                registrationDeadline: '01.08.2025',
                duration: '2 Tage / 16 Stunden'
            });
            const [reviews, setReviews] = useState([]);
            const [coursePrices, setCoursePrices] = useState([]);
            const [qualifications, setQualifications] = useState([]);
            const [newCourse, setNewCourse] = useState({
                type: '',
                date: '',
                deadline: '',
                spots: ''
            });
            const [newReview, setNewReview] = useState({
                name: '',
                initials: '',
                rating: 5,
                text: '',
                date: new Date().toLocaleDateString('de-DE')
            });
            const [newQualification, setNewQualification] = useState('');
            const [password, setPassword] = useState('');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [saveMessage, setSaveMessage] = useState('');
            const [activeTab, setActiveTab] = useState('courses');
            const [loading, setLoading] = useState(false);

            const ADMIN_PASSWORD = 's&w.357mag';

            useEffect(() => {
                if (isAuthenticated) {
                    loadData();
                }
            }, [isAuthenticated]);

            // ========================================
            // 🔥 FIREBASE DATEN LADEN
            // ========================================
            const loadData = async () => {
                setLoading(true);
                try {
                    // Kurse laden
                    const coursesSnapshot = await db.collection('courses').doc('courseList').get();
                    if (coursesSnapshot.exists) {
                        setCourses(coursesSnapshot.data().list || []);
                    } else {
                        const initialCourses = [
                            { type: 'Allgemeine Waffensachkunde', date: '15.03.2025', deadline: '01.08.2025', spots: '12/15' },
                            { type: 'Erweiterte Waffensachkunde', date: '22.03.2025', deadline: '15.08.2025', spots: '8/10' },
                            { type: 'Schießstandaufsicht', date: '05.04.2025', deadline: '25.03.2025', spots: '10/15' },
                            { type: 'Anfängertraining Standard', date: '12.04.2025', deadline: '05.04.2025', spots: '5/8' },
                            { type: 'Anfängertraining 3-Stellung', date: '19.04.2025', deadline: '12.04.2025', spots: '7/10' },
                            { type: 'Leistungstraining', date: '26.04.2025', deadline: '19.04.2025', spots: '6/8' },
                            { type: 'Waffenrechtliche Ausbildung', date: 'Nach Vereinbarung', deadline: '-', spots: '-' },
                            { type: 'Waffenbeurteilung', date: 'Nach Vereinbarung', deadline: '-', spots: '-' }
                        ];
                        await db.collection('courses').doc('courseList').set({ list: initialCourses });
                        setCourses(initialCourses);
                    }

                    // Kurs-Info laden
                    const infoSnapshot = await db.collection('courseInfo').doc('info').get();
                    if (infoSnapshot.exists) {
                        setCourseInfo(infoSnapshot.data());
                    } else {
                        await db.collection('courseInfo').doc('info').set(courseInfo);
                    }

                    // Bewertungen laden
                    const reviewsSnapshot = await db.collection('reviews').doc('reviewList').get();
                    if (reviewsSnapshot.exists) {
                        setReviews(reviewsSnapshot.data().list || []);
                    } else {
                        const initialReviews = [
                            { name: 'Max Mustermann', initials: 'MM', rating: 5, text: 'Sehr kompetenter Kursleiter! Habe meine Prüfung auf Anhieb bestanden und fühle mich jetzt sicher im Umgang mit Waffen.', date: '15.02.2025' },
                            { name: 'Erika Test', initials: 'ET', rating: 5, text: 'Das Training war perfekt auf meine Bedürfnisse zugeschnitten. Super geduldige Erklärungen und professionelle Atmosphäre.', date: '28.01.2025' },
                            { name: 'Jürgen Meyer', initials: 'JM', rating: 4, text: 'Guter Kurs, allerdings etwas schnell für Anfänger. Trotzdem alles wichtige vermittelt bekommen.', date: '10.01.2025' }
                        ];
                        await db.collection('reviews').doc('reviewList').set({ list: initialReviews });
                        setReviews(initialReviews);
                    }

                    // Preise laden
                    const pricesSnapshot = await db.collection('prices').doc('priceList').get();
                    if (pricesSnapshot.exists) {
                        setCoursePrices(pricesSnapshot.data().list || []);
                    } else {
                        const initialPrices = [
                            { name: 'Allgemeine Waffensachkunde', price: '120,00 €', note: '(bei Einzelunterricht 250,00 €)' },
                            { name: 'Erweiterte Waffensachkunde', price: '250,00 €', note: '' },
                            { name: 'Schießstandaufsicht', price: '10,00 €', note: '' },
                            { name: 'Anfängertraining Standard', price: '15,00 €', note: '' },
                            { name: 'Anfängertraining 3-Stellung', price: '15,00 €', note: '' },
                            { name: 'Leistungstraining', price: '20,00 €', note: '' },
                            { name: 'Waffenrechtliche Erbfälle', price: 'Preis nach Absprache', note: '' },
                            { name: 'Waffenbeurteilung', price: 'Preis nach Absprache', note: '' }
                        ];
                        await db.collection('prices').doc('priceList').set({ list: initialPrices });
                        setCoursePrices(initialPrices);
                    }

                    // Qualifikationen laden
                    const qualSnapshot = await db.collection('qualifications').doc('qualList').get();
                    if (qualSnapshot.exists) {
                        setQualifications(qualSnapshot.data().list || []);
                    } else {
                        const initialQual = [
                            'Staatlich zugelassender Waffensachkundeprüfer',
                            'DSB/BSSB lizenzierter Trainer seit 2000',
                            'Mehr als 20 Jahre Schulungserfahrung',
                            'Spezialisiert auf §7 WaffG und §10 AWaffV',
                            'Regelmäßige Fortbildungen und Zertifizierungen'
                        ];
                        await db.collection('qualifications').doc('qualList').set({ list: initialQual });
                        setQualifications(initialQual);
                    }

                } catch (error) {
                    console.error('Fehler beim Laden:', error);
                    showSaveMessage('Fehler beim Laden der Daten!');
                } finally {
                    setLoading(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === ADMIN_PASSWORD) {
                    setIsAuthenticated(true);
                } else {
                    alert('Falsches Passwort!');
                }
            };

            const handleAddCourse = async () => {
                if (!newCourse.type || !newCourse.date || !newCourse.deadline || !newCourse.spots) {
                    alert('Bitte alle Felder ausfüllen!');
                    return;
                }

                const updatedCourses = [...courses, { ...newCourse }];
                setCourses(updatedCourses);
                await db.collection('courses').doc('courseList').set({ list: updatedCourses });
                
                setNewCourse({ type: '', date: '', deadline: '', spots: '' });
                showSaveMessage('Kurs hinzugefügt!');
            };

            const handleDeleteCourse = async (index) => {
                if (window.confirm('Möchten Sie diesen Kurs wirklich löschen?')) {
                    const updatedCourses = courses.filter((_, i) => i !== index);
                    setCourses(updatedCourses);
                    await db.collection('courses').doc('courseList').set({ list: updatedCourses });
                    showSaveMessage('Kurs gelöscht!');
                }
            };

            const handleSaveCourseInfo = async () => {
                await db.collection('courseInfo').doc('info').set(courseInfo);
                showSaveMessage('Informationen gespeichert!');
            };

            const handleAddReview = async () => {
                if (!newReview.name || !newReview.initials || !newReview.text) {
                    alert('Bitte alle Felder ausfüllen!');
                    return;
                }

                const reviewToAdd = {
                    ...newReview,
                    date: new Date().toLocaleDateString('de-DE')
                };

                const updatedReviews = [reviewToAdd, ...reviews];
                setReviews(updatedReviews);
                await db.collection('reviews').doc('reviewList').set({ list: updatedReviews });
                
                setNewReview({ name: '', initials: '', rating: 5, text: '', date: '' });
                showSaveMessage('Bewertung hinzugefügt!');
            };

            const handleDeleteReview = async (index) => {
                if (window.confirm('Möchten Sie diese Bewertung wirklich löschen?')) {
                    const updatedReviews = reviews.filter((_, i) => i !== index);
                    setReviews(updatedReviews);
                    await db.collection('reviews').doc('reviewList').set({ list: updatedReviews });
                    showSaveMessage('Bewertung gelöscht!');
                }
            };

            const handleUpdatePrice = (index, field, value) => {
                const updatedPrices = [...coursePrices];
                updatedPrices[index] = { ...updatedPrices[index], [field]: value };
                setCoursePrices(updatedPrices);
            }; 

            const handleSavePrices = async () => {
                try {
                    await db.collection('prices').doc('priceList').set({ list: coursePrices });
                    showSaveMessage('Preise gespeichert!');
                } catch (error) {
                    console.error("Fehler beim Speichern der Preise:", error);
                    alert("Fehler beim Speichern! Schau in die Entwicklerkonsole (F12).");
                }
            };

            const handleAddQualification = async () => {
                if (!newQualification.trim()) {
                    alert('Bitte eine Qualifikation eingeben!');
                    return;
                }

                const updatedQualifications = [...qualifications, newQualification.trim()];
                setQualifications(updatedQualifications);
                await db.collection('qualifications').doc('qualList').set({ list: updatedQualifications });
                
                setNewQualification('');
                showSaveMessage('Qualifikation hinzugefügt!');
            };

            const handleDeleteQualification = async (index) => {
                if (window.confirm('Möchten Sie diese Qualifikation wirklich löschen?')) {
                    const updatedQualifications = qualifications.filter((_, i) => i !== index);
                    setQualifications(updatedQualifications);
                    await db.collection('qualifications').doc('qualList').set({ list: updatedQualifications });
                    showSaveMessage('Qualifikation gelöscht!');
                }
            };

            const handleUpdateQualification = (index, value) => {
                const updatedQualifications = [...qualifications];
                updatedQualifications[index] = value;
                setQualifications(updatedQualifications);
            };

            const handleSaveQualifications = async () => {
                await db.collection('qualifications').doc('qualList').set({ list: qualifications });
                showSaveMessage('Qualifikationen gespeichert!');
            };

            const showSaveMessage = (message) => {
                setSaveMessage(message);
                setTimeout(() => setSaveMessage(''), 3000);
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
                            <h1 className="text-2xl font-bold text-green-800 mb-6 text-center">Admin Login</h1>
                            <form onSubmit={handleLogin}>
                                <div className="mb-4">
                                    <label className="block text-gray-700 font-medium mb-2">Passwort</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="Passwort eingeben"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="w-full bg-green-700 hover:bg-green-800 text-white py-2 px-4 rounded-lg font-medium transition"
                                >
                                    Anmelden
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-b-4 border-green-700 mx-auto mb-4"></div>
                            <p className="text-green-800 font-medium">Daten werden geladen...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-green-100 p-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h1 className="text-3xl font-bold text-green-800 mb-2">Homepage CMS</h1>
                            <p className="text-gray-600">Verwalte Kurse, Preise, Qualifikationen und Bewertungen</p>
                            {saveMessage && (
                                <div className="mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                                    {saveMessage}
                                </div>
                            )}
                        </div>

                        {/* Tab Navigation */}
                        <div className="bg-white rounded-lg shadow-lg mb-6">
                            <div className="flex border-b overflow-x-auto">
                                <button
                                    onClick={() => setActiveTab('courses')}
                                    className={`flex-1 py-4 px-6 font-medium transition whitespace-nowrap ${
                                        activeTab === 'courses' ? 'bg-green-700 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                    }`}
                                >
                                    Kursverwaltung
                                </button>
                                <button
                                    onClick={() => setActiveTab('prices')}
                                    className={`flex-1 py-4 px-6 font-medium transition whitespace-nowrap ${
                                        activeTab === 'prices' ? 'bg-green-700 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                    }`}
                                >
                                    Preise
                                </button>
                                <button
                                    onClick={() => setActiveTab('qualifications')}
                                    className={`flex-1 py-4 px-6 font-medium transition whitespace-nowrap ${
                                        activeTab === 'qualifications' ? 'bg-green-700 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                    }`}
                                >
                                    Qualifikationen
                                </button>
                                <button
                                    onClick={() => setActiveTab('reviews')}
                                    className={`flex-1 py-4 px-6 font-medium transition whitespace-nowrap ${
                                        activeTab === 'reviews' ? 'bg-green-700 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                    }`}
                                >
                                    Bewertungen
                                </button>
                            </div>
                        </div>

                        {/* Kursverwaltung */}
                        {activeTab === 'courses' && (
                            /* ... (Unveränderter Kurs-Code) ... */
                            <>
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Aktuelle Informationen</h2>
                                    <div className="grid md:grid-cols-3 gap-4 mb-4">
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Nächster Kursbeginn</label>
                                            <input
                                                type="text"
                                                value={courseInfo.nextCourseDate}
                                                onChange={(e) => setCourseInfo({ ...courseInfo, nextCourseDate: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Anmeldeschluss</label>
                                            <input
                                                type="text"
                                                value={courseInfo.registrationDeadline}
                                                onChange={(e) => setCourseInfo({ ...courseInfo, registrationDeadline: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Kursdauer</label>
                                            <input
                                                type="text"
                                                value={courseInfo.duration}
                                                onChange={(e) => setCourseInfo({ ...courseInfo, duration: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleSaveCourseInfo}
                                        className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                                    >
                                        <Save />
                                        Informationen speichern
                                    </button>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Neuen Kurs hinzufügen</h2>
                                    <div className="grid md:grid-cols-4 gap-4 mb-4">
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Kurstyp</label>
                                            <input
                                                type="text"
                                                value={newCourse.type}
                                                onChange={(e) => setNewCourse({ ...newCourse, type: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Datum</label>
                                            <input
                                                type="text"
                                                value={newCourse.date}
                                                onChange={(e) => setNewCourse({ ...newCourse, date: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Anmeldeschluss</label>
                                            <input
                                                type="text"
                                                value={newCourse.deadline}
                                                onChange={(e) => setNewCourse({ ...newCourse, deadline: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Plätze</label>
                                            <input
                                                type="text"
                                                value={newCourse.spots}
                                                onChange={(e) => setNewCourse({ ...newCourse, spots: e.target.value })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleAddCourse}
                                        className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                                    >
                                        <Plus />
                                        Kurs hinzufügen
                                    </button>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Aktuelle Kurse</h2>
                                    <div className="overflow-x-auto">
                                        <table className="min-w-full">
                                            <thead>
                                                <tr className="bg-green-700 text-white">
                                                    <th className="py-3 px-4 text-left">Kurstyp</th>
                                                    <th className="py-3 px-4 text-left">Datum</th>
                                                    <th className="py-3 px-4 text-left">Anmeldeschluss</th>
                                                    <th className="py-3 px-4 text-left">Plätze</th>
                                                    <th className="py-3 px-4 text-left">Aktion</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-200">
                                                {courses.map((course, index) => (
                                                    <tr key={index} className={index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                        <td className="py-3 px-4">{course.type}</td>
                                                        <td className="py-3 px-4">{course.date}</td>
                                                        <td className="py-3 px-4">{course.deadline}</td>
                                                        <td className="py-3 px-4">{course.spots}</td>
                                                        <td className="py-3 px-4">
                                                            <button
                                                                onClick={() => handleDeleteCourse(index)}
                                                                className="text-red-600 hover:text-red-800 transition"
                                                            >
                                                                <Trash2 />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </>
                        )}

                        {/* Preisverwaltung */}
                        {activeTab === 'prices' && (
                            <div className="bg-white rounded-lg shadow-lg p-6">
                                <h2 className="text-2xl font-bold text-green-800 mb-4">Kurspreise verwalten</h2>
                                <p className="text-gray-600 mb-6">Bearbeiten Sie die Preise für jeden Kurs.</p>
                                
                                <div className="space-y-4 mb-6">
                                    {coursePrices.map((course, index) => (
                                        <div key={index} className="border border-gray-200 rounded-lg p-4">
                                            <div className="grid md:grid-cols-3 gap-4">
                                                <div>
                                                    <label className="block text-gray-700 font-medium mb-2">Kursname</label>
                                                    <input
                                                        type="text"
                                                        value={course.name}
                                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50"
                                                        disabled
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-gray-700 font-medium mb-2">Preis</label>
                                                    <input
                                                        type="text"
                                                        value={course.price}
                                                        onChange={(e) => handleUpdatePrice(index, 'price', e.target.value)}
                                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-gray-700 font-medium mb-2">Zusatzinfo</label>
                                                    {/* FEHLER BEHOBEN: Hier stand 'price' statt 'note' im onChange-Event */}
                                                    <input
                                                        type="text"
                                                        value={course.note}
                                                        onChange={(e) => handleUpdatePrice(index, 'note', e.target.value)}
                                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button
                                    onClick={handleSavePrices}
                                    className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                                >
                                    <Save />
                                    Preise speichern
                                </button>
                            </div>
                        )}

                        {/* Qualifikationsverwaltung */}
                        {activeTab === 'qualifications' && (
                            /* ... (Unveränderter Qualifikations-Code) ... */
                            <>
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Neue Qualifikation hinzufügen</h2>
                                    <div className="flex gap-4">
                                        <input
                                            type="text"
                                            value={newQualification}
                                            onChange={(e) => setNewQualification(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleAddQualification()}
                                            className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        />
                                        <button
                                            onClick={handleAddQualification}
                                            className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                                        >
                                            <Plus />
                                            Hinzufügen
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Meine Qualifikationen</h2>
                                    
                                    <div className="space-y-3 mb-6">
                                        {qualifications.map((qual, index) => (
                                            <div key={index} className="flex items-center gap-3 p-3 border border-gray-200 rounded-lg bg-gray-50">
                                                <svg className="h-5 w-5 text-green-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                                                </svg>
                                                <input
                                                    type="text"
                                                    value={qual}
                                                    onChange={(e) => handleUpdateQualification(index, e.target.value)}
                                                    className="flex-1 px-3 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-green-600 bg-white"
                                                />
                                                <button
                                                    onClick={() => handleDeleteQualification(index)}
                                                    className="text-red-600 hover:text-red-800 transition flex-shrink-0"
                                                >
                                                    <Trash2 />
                                                </button>
                                            </div>
                                        ))}
                                    </div>

                                    {qualifications.length > 0 && (
                                        <button
                                            onClick={handleSaveQualifications}
                                            className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                                        >
                                            <Save />
                                            Qualifikationen speichern
                                        </button>
                                    )}
                                </div>
                            </>
                        )}

                        {/* Bewertungsverwaltung */}
                        {activeTab === 'reviews' && (
                             /* ... (Unveränderter Bewertungs-Code) ... */
                            <>
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Neue Bewertung hinzufügen</h2>
                                    <div className="space-y-4 mb-4">
                                        <div className="grid md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-gray-700 font-medium mb-2">Name</label>
                                                <input
                                                    type="text"
                                                    value={newReview.name}
                                                    onChange={(e) => setNewReview({ ...newReview, name: e.target.value })}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-gray-700 font-medium mb-2">Initialen (2 Buchstaben)</label>
                                                <input
                                                    type="text"
                                                    maxLength="2"
                                                    value={newReview.initials}
                                                    onChange={(e) => setNewReview({ ...newReview, initials: e.target.value.toUpperCase() })}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Bewertung (Sterne)</label>
                                            <div className="flex gap-2">
                                                {[1, 2, 3, 4, 5].map((star) => (
                                                    <button
                                                        key={star}
                                                        onClick={() => setNewReview({ ...newReview, rating: star })}
                                                        className="text-yellow-500 hover:scale-110 transition"
                                                    >
                                                        <Star filled={star <= newReview.rating} />
                                                    </button>
                                                ))}
                                                <span className="ml-2 text-gray-700">{newReview.rating} / 5 Sterne</span>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">Bewertungstext</label>
                                            <textarea
                                                value={newReview.text}
                                                onChange={(e) => setNewReview({ ...newReview, text: e.target.value })}
                                                rows="4"
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                            />
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleAddReview}
                                        className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                                    >
                                        <Plus />
                                        Bewertung hinzufügen
                                    </button>
                                </div>

                                <div className="bg-white rounded-lg shadow-lg p-6">
                                    <h2 className="text-2xl font-bold text-green-800 mb-4">Alle Bewertungen ({reviews.length})</h2>
                                    <div className="grid md:grid-cols-2 gap-4">
                                        {reviews.map((review, index) => (
                                            <div key={index} className="border border-gray-200 rounded-lg p-4 relative">
                                                <button
                                                    onClick={() => handleDeleteReview(index)}
                                                    className="absolute top-2 right-2 text-red-600 hover:text-red-800 transition"
                                                >
                                                    <Trash2 />
                                                </button>
                                                <div className="flex items-center mb-3">
                                                    <div className="w-12 h-12 rounded-full bg-green-700 flex items-center justify-center text-xl font-bold text-white">
                                                        {review.initials}
                                                    </div>
                                                    <div className="ml-3">
                                                        <h4 className="font-semibold text-gray-800">{review.name}</h4>
                                                        <div className="flex text-yellow-500">
                                                            {[1, 2, 3, 4, 5].map((star) => (
                                                                <Star key={star} filled={star <= review.rating} />
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                                <p className="text-gray-700 mb-2">{review.text}</p>
                                                <p className="text-sm text-gray-500">{review.date}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CourseCMSAdmin />);
    </script>
</body>
</html>
