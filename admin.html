<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kursplan Admin</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React und ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React Icons als einfache SVG-Komponenten
        const Plus = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Save = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
        );

        function CourseCMSAdmin() {
            const [courses, setCourses] = useState([]);
            const [courseInfo, setCourseInfo] = useState({
                nextCourseDate: '01.08.2025',
                registrationDeadline: '01.08.2025',
                duration: '2 Tage / 16 Stunden'
            });
            const [newCourse, setNewCourse] = useState({
                type: '',
                date: '',
                deadline: '',
                spots: ''
            });
            const [password, setPassword] = useState('');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [saveMessage, setSaveMessage] = useState('');

            const ADMIN_PASSWORD = 'valentingeilefüße'

            useEffect(() => {
                if (isAuthenticated) {
                    loadData();
                }
            }, [isAuthenticated]);

            const loadData = () => {
                try {
                    const savedCourses = localStorage.getItem('coursePlan');
                    const savedInfo = localStorage.getItem('courseInfo');
                    
                    if (savedCourses) {
                        setCourses(JSON.parse(savedCourses));
                    } else {
                        const initialCourses = [
                            { type: 'Allgemeine Waffensachkunde', date: '15.03.2025', deadline: '01.08.2025', spots: '12/15' },
                            { type: 'Erweiterte Waffensachkunde', date: '22.03.2025', deadline: '15.08.2025', spots: '8/10' },
                            { type: 'Schießstandaufsicht', date: '05.04.2025', deadline: '25.03.2025', spots: '10/15' },
                            { type: 'Anfängertraining Standard', date: '12.04.2025', deadline: '05.04.2025', spots: '5/8' },
                            { type: 'Anfängertraining 3-Stellung', date: '19.04.2025', deadline: '12.04.2025', spots: '7/10' },
                            { type: 'Leistungstraining', date: '26.04.2025', deadline: '19.04.2025', spots: '6/8' },
                            { type: 'Waffenrechtliche Ausbildung', date: 'Nach Vereinbarung', deadline: '-', spots: '-' },
                            { type: 'Waffenbeurteilung', date: 'Nach Vereinbarung', deadline: '-', spots: '-' }
                        ];
                        setCourses(initialCourses);
                        localStorage.setItem('coursePlan', JSON.stringify(initialCourses));
                    }

                    if (savedInfo) {
                        setCourseInfo(JSON.parse(savedInfo));
                    }
                } catch (error) {
                    console.error('Fehler beim Laden der Daten:', error);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (password === ADMIN_PASSWORD) {
                    setIsAuthenticated(true);
                } else {
                    alert('Falsches Passwort!');
                }
            };

            const handleAddCourse = () => {
                if (!newCourse.type || !newCourse.date || !newCourse.deadline || !newCourse.spots) {
                    alert('Bitte alle Felder ausfüllen!');
                    return;
                }

                const updatedCourses = [...courses, { ...newCourse }];
                setCourses(updatedCourses);
                localStorage.setItem('coursePlan', JSON.stringify(updatedCourses));
                
                setNewCourse({ type: '', date: '', deadline: '', spots: '' });
                showSaveMessage('Kurs hinzugefügt!');
            };

            const handleDeleteCourse = (index) => {
                if (window.confirm('Möchten Sie diesen Kurs wirklich löschen?')) {
                    const updatedCourses = courses.filter((_, i) => i !== index);
                    setCourses(updatedCourses);
                    localStorage.setItem('coursePlan', JSON.stringify(updatedCourses));
                    showSaveMessage('Kurs gelöscht!');
                }
            };

            const handleSaveCourseInfo = () => {
                localStorage.setItem('courseInfo', JSON.stringify(courseInfo));
                showSaveMessage('Informationen gespeichert!');
            };

            const showSaveMessage = (message) => {
                setSaveMessage(message);
                setTimeout(() => setSaveMessage(''), 3000);
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
                            <h1 className="text-2xl font-bold text-green-800 mb-6 text-center">Admin Login</h1>
                            <div>
                                <div className="mb-4">
                                    <label className="block text-gray-700 font-medium mb-2">Passwort</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleLogin(e)}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="Passwort eingeben"
                                    />
                                </div>
                                <button
                                    onClick={handleLogin}
                                    className="w-full bg-green-700 hover:bg-green-800 text-white py-2 px-4 rounded-lg font-medium transition"
                                >
                                    Anmelden
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-green-100 p-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h1 className="text-3xl font-bold text-green-800 mb-2">Kursplan CMS</h1>
                            <p className="text-gray-600">Verwalten Sie Ihre Kurse und Informationen</p>
                            {saveMessage && (
                                <div className="mt-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                                    {saveMessage}
                                </div>
                            )}
                        </div>

                        {/* Aktuelle Informationen bearbeiten */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 className="text-2xl font-bold text-green-800 mb-4">Aktuelle Informationen</h2>
                            <div className="grid md:grid-cols-3 gap-4 mb-4">
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Nächster Kursbeginn</label>
                                    <input
                                        type="text"
                                        value={courseInfo.nextCourseDate}
                                        onChange={(e) => setCourseInfo({ ...courseInfo, nextCourseDate: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. 01.08.2025"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Anmeldeschluss</label>
                                    <input
                                        type="text"
                                        value={courseInfo.registrationDeadline}
                                        onChange={(e) => setCourseInfo({ ...courseInfo, registrationDeadline: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. 01.08.2025"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Kursdauer</label>
                                    <input
                                        type="text"
                                        value={courseInfo.duration}
                                        onChange={(e) => setCourseInfo({ ...courseInfo, duration: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. 2 Tage / 16 Stunden"
                                    />
                                </div>
                            </div>
                            <button
                                onClick={handleSaveCourseInfo}
                                className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                            >
                                <Save />
                                Informationen speichern
                            </button>
                        </div>

                        {/* Neuen Kurs hinzufügen */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 className="text-2xl font-bold text-green-800 mb-4">Neuen Kurs hinzufügen</h2>
                            <div className="grid md:grid-cols-4 gap-4 mb-4">
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Kurstyp</label>
                                    <input
                                        type="text"
                                        value={newCourse.type}
                                        onChange={(e) => setNewCourse({ ...newCourse, type: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. Waffensachkunde"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Datum</label>
                                    <input
                                        type="text"
                                        value={newCourse.date}
                                        onChange={(e) => setNewCourse({ ...newCourse, date: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. 15.03.2025"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Anmeldeschluss</label>
                                    <input
                                        type="text"
                                        value={newCourse.deadline}
                                        onChange={(e) => setNewCourse({ ...newCourse, deadline: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. 08.03.2025"
                                    />
                                </div>
                                <div>
                                    <label className="block text-gray-700 font-medium mb-2">Plätze</label>
                                    <input
                                        type="text"
                                        value={newCourse.spots}
                                        onChange={(e) => setNewCourse({ ...newCourse, spots: e.target.value })}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"
                                        placeholder="z.B. 12/15"
                                    />
                                </div>
                            </div>
                            <button
                                onClick={handleAddCourse}
                                className="bg-green-700 hover:bg-green-800 text-white py-2 px-6 rounded-lg font-medium transition flex items-center gap-2"
                            >
                                <Plus />
                                Kurs hinzufügen
                            </button>
                        </div>

                        {/* Kursliste */}
                        <div className="bg-white rounded-lg shadow-lg p-6">
                            <h2 className="text-2xl font-bold text-green-800 mb-4">Aktuelle Kurse</h2>
                            <div className="overflow-x-auto">
                                <table className="min-w-full">
                                    <thead>
                                        <tr className="bg-green-700 text-white">
                                            <th className="py-3 px-4 text-left">Kurstyp</th>
                                            <th className="py-3 px-4 text-left">Datum</th>
                                            <th className="py-3 px-4 text-left">Anmeldeschluss</th>
                                            <th className="py-3 px-4 text-left">Plätze</th>
                                            <th className="py-3 px-4 text-left">Aktion</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {courses.map((course, index) => (
                                            <tr key={index} className={index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                <td className="py-3 px-4">{course.type}</td>
                                                <td className="py-3 px-4">{course.date}</td>
                                                <td className="py-3 px-4">{course.deadline}</td>
                                                <td className="py-3 px-4">{course.spots}</td>
                                                <td className="py-3 px-4">
                                                    <button
                                                        onClick={() => handleDeleteCourse(index)}
                                                        className="text-red-600 hover:text-red-800 transition"
                                                    >
                                                        <Trash2 />
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render die App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CourseCMSAdmin />);
    </script>
</body>
</html>
